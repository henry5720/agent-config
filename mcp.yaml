servers:
  # 版本釘死：@latest 每次啟動都抓新版，壞掉時不知道是哪一版。升級就改這裡。
  # --browser-url 連 127.0.0.1:9222 的 Chrome，9222 由 browser-access skill 照 dotfiles 的 docs/remote-access/browser.md 開 headless（或接使用者的獨立 profile）；
  # 少了它 server 會想自己開一個 Chrome 然後失敗。
  chrome-devtools:
    command: npx
    args:
      - -y
      - chrome-devtools-mcp@1.10.1
      - --browser-url=http://127.0.0.1:9222
      - --no-usage-statistics
      - --no-performance-crux
    targets: [claude, codex, opencode]
  codegraph:
    command: codegraph
    args: [serve, --mcp]
    targets: [claude, codex, opencode]
  # key 從環境變數讀，不進 repo。dotfiles 會 export CONTEXT7_API_KEY。
  context7:
    url: https://mcp.context7.com/mcp
    headers:
      CONTEXT7_API_KEY:
        fromEnv: CONTEXT7_API_KEY
    targets: [claude, codex, opencode]
  gh_grep:
    url: https://mcp.grep.app
    targets: [claude, codex, opencode]
  # 公司 PMS（正式環境）。OAuth（DCR），各 client 第一次用時自己登入，repo 不存 token。
  # 分兩個 surface：work＝個人工作、project＝專案交付，名字跟網址最後一段一樣。
  # 不接不帶 surface 的 /mcp：那裡是另一套扁平工具（create_issue、clock_in…），沒有 get_my_context。
  teamsync-pms-work:
    url: https://pms.teamsync.com.tw/c/tnt_6b24e7fe8a974ac6850f84557cfc15ce/mcp/work
    targets: [claude, codex, opencode]
  teamsync-pms-project:
    url: https://pms.teamsync.com.tw/c/tnt_6b24e7fe8a974ac6850f84557cfc15ce/mcp/project
    targets: [claude, codex, opencode]
  # 操作 Windows 桌面（localhost 模式）。包裝腳本只在桌機 WSL 找得到 windows-mcp.exe，
  # 其他機器會直接結束，這個 server 顯示連不上。經 sh 展開 $HOME，各台的家目錄不同也能用。
  windows-mcp:
    command: sh
    args: [-c, 'exec "$HOME/.claude/skills/windows-mcp/scripts/windows-mcp-stdio"']
    targets: [claude, codex, opencode]
