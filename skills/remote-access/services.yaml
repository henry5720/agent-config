# remote-access up／down 用的服務定義。機器清單是 ssh config 的 Host，不寫在這裡。
# 公開 repo：key 只寫從哪個環境變數拿，不寫值。
services:
  windows-mcp:
    # windows-mcp 有 key，走 tailscale serve：MCP 直接連 https://<那台 ts.net 名稱>/mcp
    mode: serve
    # Windows-MCP serve 的預設 port；tailscale serve 從 443 轉進來，不佔 agent 這台的 port
    port: 8000
    # 截圖、點擊要在桌面 session 跑，從 ssh 起會沒有畫面，所以用 Interactive task 起
    needs_desktop: true
    start:
      # keep: true 常駐，第一次建（要先問使用者），之後每次 up 只 schtasks /run；客戶機器改 false
      - task: {name: remote-access-windows-mcp, keep: true}
    # 停：停 task、停聽 port 而且命令列有 windows-mcp 的行程，別的程式不動
    stop: {match: windows-mcp}
    verify:
      path: /mcp
      # MCP initialize：不帶 key 401，帶 key 200
      body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"remote-access","version":"1"}}}'
      headers:
        - "Content-Type: application/json"
        - "Accept: application/json, text/event-stream"
      expect_without: 401
      expect_with: 200
    key: {env: WINDOWS_MCP_AUTH_KEY}
    # 允許連進來的 agent 機器（tailnet 名稱），CLI 用 tailscale ip -4 換成 IP，寫進那台設定檔（TOML）的 ip_allowlist。
    # serve 轉進來時 server 看到的是呼叫端的 tailnet IP，寫 127.0.0.1 會全部 403（#137 prototype）
    allow: [company-ec2]
    # forward 模式（hosts 底下對 serve 連不到的機器設 mode: forward）時 agent 這台接的本機 port，
    # 不跟 remote-access SKILL.md 本機 port 總表的其他 port 撞。forward 不用 allow：server 綁 127.0.0.1，只有 ssh 轉得進來
    local_port: 18000
    # 個別 host 的覆寫（key 是 ssh config 的 Host）：底下的欄位整個蓋掉上面同名的。
    # 客戶機器不留 task：up 建、down 刪，不用 --create-task。serve 連不到的機器設 mode: forward。
    # hosts:
    #   <客戶的 Host>:
    #     start: [{task: {name: remote-access-windows-mcp, keep: false}}]
  browser:
    # 使用者在 Windows 個人電腦上的獨立 profile Chrome（browser-access）。CDP 沒有驗證，只走 ssh 轉發
    mode: forward
    port: 9222
    # chrome-devtools MCP 寫死 127.0.0.1:9222（mcp.yaml），本機也接 9222。被佔就報錯，不換
    local_port: 9222
    # Interactive task 開在使用者的桌面：從 ssh 直接開的 Chrome 在 session 0，看不到視窗
    needs_desktop: true
    start:
      # task 由 browser-access 照 dotfiles 服務卡建（要先問使用者），up 只 schtasks /run，不建
      - task: {name: chrome-agent, keep: true}
    # 聽 9222 而且命令列有 chrome-agent（--user-data-dir）的才是這支；down 只關轉發，Chrome 和分頁留給使用者
    stop: {match: chrome-agent, keep_running: true}
    verify:
      path: /json/version
      expect_without: 200
      # 每支 Chrome 的 webSocketDebuggerUrl 不同：這台 9222 看到的要跟那台自己的一樣，不然就是接到別支
      same_as_host: webSocketDebuggerUrl
    # stdio 的 MCP，mcp.yaml 沒有網址可以對
    mcp: chrome-devtools
