# speak：Claude Code、Codex 回完話（Stop）把回覆唸到個人電腦。
# 只做一件事：把 Stop hook 的 stdin 原樣交給 dotfiles 裝的 voice-out-speak（勾了 snapserver 才有）。
# 找不到它就 exit 0，所以每台都能裝。只掛 Stop、不掛 SubagentStop：不唸 subagent 的回覆。
#
# async 加 --background 兩個都要：
# - async：服務關著時 voice-out-speak 要 0.5 秒才判斷完，async 讓 agent 連這 0.5 秒都不等
# - --background：Codex 在 hook 結束、session 關掉時會砍掉 hook 的 process group，
#   Claude Code 的 -p 結束也會砍掉沒跑完的 async hook；朗讀要等 TTS 加播完（約 9 秒），
#   所以讓 voice-out-speak 自己脫離（setsid）在背景唸
# 檢查路徑而不是靠 PATH：hook 的 PATH 不一定有 ~/.local/bin。
#
# 兩邊的 events 是各自的原生格式（Claude Code 的 timeout 與 Codex 的 timeout 都是秒）。
# 每台怎麼裝見 README 的「hook」段。
description: 回完話把回覆唸到個人電腦（voice-out-speak，沒裝就略過）
bindings:
  claude:
    events:
      Stop:
        - hooks:
            - type: command
              command: '[ -x "$HOME/.local/bin/voice-out-speak" ] && exec "$HOME/.local/bin/voice-out-speak" --background; exit 0'
              async: true
              timeout: 30
  codex:
    events:
      Stop:
        - hooks:
            - type: command
              command: '[ -x "$HOME/.local/bin/voice-out-speak" ] && exec "$HOME/.local/bin/voice-out-speak" --background; exit 0'
              async: true
              timeout: 30
